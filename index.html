<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的感恩手帳 📖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- CryptoJS AES 輕量級加密庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

  <style>
    :root {
      --bg-color: #FAF6EE;
      --card-bg: #FFFFFF;
      --primary-color: #D97736;
      --accent-color: #E28743;
      --text-main: #3D3A37;
      --text-sub: #7A746E;
      --quote-bg: #FFF8E7;
      --border-color: #EBDDCB;
      --selected-bg: #FFEAD2;
      --danger-color: #E05656;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px 14px 40px;
      line-height: 1.6;
    }
    .container { max-width: 540px; margin: 0 auto; }

    .header {
      position: relative;
      text-align: center;
      padding: 18px 14px;
      background: #FFFFFF;
      border-radius: 18px;
      border: 2px dashed var(--border-color);
      margin-bottom: 16px;
    }
    .header h1 { font-size: 22px; color: var(--primary-color); }
    .header p { font-size: 13px; color: var(--text-sub); margin-top: 3px; }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: #EFE7DB;
      padding: 6px;
      border-radius: 14px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-sub);
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #FFFFFF;
      color: var(--primary-color);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .write-card {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 20px 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 12px rgba(184, 160, 137, 0.12);
      margin-bottom: 24px;
    }

    .today-date-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-color);
      border-bottom: 2px dashed #F2E5D5;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    .step-indicator {
      font-size: 13px;
      background: var(--quote-bg);
      color: var(--primary-color);
      padding: 3px 8px;
      border-radius: 10px;
    }

    .picker-section { margin-bottom: 14px; }
    .picker-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .icon-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .select-pill {
      flex: 1;
      min-width: 60px;
      padding: 8px 4px;
      background: #FAF6EE;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      transition: all 0.2s;
    }
    .select-pill.active {
      background: var(--selected-bg);
      border-color: var(--primary-color);
      color: var(--primary-color);
      transform: scale(1.03);
    }

    .custom-mood-input {
      width: 100%;
      margin-top: 8px;
      padding: 9px 12px;
      font-size: 15px;
      border: 1.5px dashed var(--border-color);
      border-radius: 10px;
      outline: none;
      background-color: #FCFBF7;
      font-family: inherit;
    }
    .custom-mood-input:focus {
      border-color: var(--primary-color);
      background-color: #FFFFFF;
    }

    .photo-upload-box {
      border: 2px dashed var(--border-color);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      background: #FCFBF7;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 14px;
    }
    .photo-upload-box:hover {
      border-color: var(--primary-color);
      background: #FFFDF9;
    }
    .photo-preview-wrap {
      position: relative;
      display: inline-block;
      max-width: 100%;
      margin-top: 8px;
    }
    .photo-preview-img {
      max-height: 180px;
      width: auto;
      max-width: 100%;
      border-radius: 12px;
      border: 2px solid var(--border-color);
      object-fit: cover;
    }
    .photo-remove-btn {
      position: absolute;
      top: -8px;
      right: -8px;
      background: var(--danger-color);
      color: #FFF;
      border: none;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .three-things-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 10px;
    }
    .item-input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #FCFBF7;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 8px 12px;
    }
    .input-row:focus-within {
      border-color: var(--primary-color);
      background: #FFFFFF;
    }
    .row-num {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-color);
      min-width: 20px;
    }
    .input-row input {
      width: 100%;
      border: none;
      background: transparent;
      outline: none;
      font-size: 16px;
      font-family: inherit;
      color: var(--text-main);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .action-btn {
      width: 100%;
      padding: 13px;
      background: var(--primary-color);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(217, 119, 54, 0.25);
    }
    .secondary-btn {
      width: 35%;
      background: #EFE7DB;
      color: var(--text-main);
      box-shadow: none;
    }
    .action-btn:disabled { background: #CCC; cursor: not-allowed; box-shadow: none; }

    .calendar-card {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 18px 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 12px rgba(184, 160, 137, 0.12);
      margin-bottom: 16px;
    }
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
    }
    .cal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-color);
    }
    .cal-nav-btn {
      background: #FAF6EE;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 5px 12px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }
    .cal-day-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .cal-day-num {
      font-size: 14px;
      color: var(--text-sub);
    }
    .cal-bubble {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border: 2px solid var(--primary-color);
      background-size: cover;
      background-position: center;
      transition: transform 0.2s;
    }
    .cal-bubble:hover {
      transform: scale(1.08);
    }
    .cal-bubble-day {
      position: absolute;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.85);
      z-index: 2;
    }
    .cal-bubble-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 1;
    }

    /* 彈窗樣式 */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.active {
      display: flex;
    }
    .modal-content {
      background: #FFFFFF;
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      position: relative;
      border: 2px solid var(--border-color);
    }
    .modal-close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #EFE7DB;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 700;
      color: var(--text-main);
    }
    .modal-photo {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 14px;
      margin-top: 10px;
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1>🌸 我的感恩日記本</h1>
      <p>🔒 私密加密保護 ｜ 典藏每一天的溫暖回憶</p>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" id="tabWrite" onclick="switchView('write')">✍️ 寫今天日記</button>
      <button class="tab-btn" id="tabReview" onclick="switchView('review')">🗓️ 回顧月曆</button>
    </div>

    <main id="writeView">
      <section class="write-card">
        <div class="today-date-bar">
          <span id="displayDate">📅 載入今天日期...</span>
          <span class="step-indicator" id="stepIndicator">第 1 / 2 步</span>
        </div>

        <div id="page1">
          <div class="picker-section">
            <div class="picker-label">☀️ 今天的天氣：</div>
            <div class="icon-group" id="weatherGroup">
              <div class="select-pill active" onclick="selectWeather('☀️ 晴天')">☀️ 晴天</div>
              <div class="select-pill" onclick="selectWeather('⛅ 多雲')">⛅ 多雲</div>
              <div class="select-pill" onclick="selectWeather('🌧️ 雨天')">🌧️ 雨天</div>
              <div class="select-pill" onclick="selectWeather('🍃 微風')">🍃 微風</div>
            </div>
          </div>

          <div class="picker-section">
            <div class="picker-label">💖 今天的心情：</div>
            <div class="icon-group" id="moodGroup">
              <div class="select-pill active" onclick="selectPresetMood('😊 開心')">😊 開心</div>
              <div class="select-pill" onclick="selectPresetMood('🥰 幸福')">🥰 幸福</div>
              <div class="select-pill" onclick="selectPresetMood('😌 平靜')">😌 平靜</div>
              <div class="select-pill" onclick="selectPresetMood('💪 充實')">💪 充實</div>
            </div>
            <input type="text" id="customMood" class="custom-mood-input" placeholder="✏️ 或自行輸入心情（例如：充滿期待、有點疲倦）" oninput="handleCustomMoodInput()">
          </div>

          <div class="picker-section">
            <div class="picker-label">📷 捕捉今天的一張照片（選填）：</div>
            <div class="photo-upload-box" onclick="document.getElementById('photoInput').click()">
              <span id="uploadHintText">📸 點我拍照或選擇相簿照片</span>
              <input type="file" id="photoInput" accept="image/*" style="display: none;" onchange="handlePhotoSelect(event)">
              <div id="previewContainer" style="display: none;" class="photo-preview-wrap">
                <img id="photoPreview" class="photo-preview-img" src="" alt="預覽照片">
                <button type="button" class="photo-remove-btn" onclick="removePhoto(event)">✕</button>
              </div>
            </div>
          </div>

          <button class="action-btn" onclick="goToStep(2)">下一步：寫感恩日記 ➡️</button>
        </div>

        <div id="page2" style="display: none;">
          <div class="three-things-title">🌸 今天想感謝或開心的 3 件事：</div>
          <div class="item-input-group">
            <div class="input-row">
              <span class="row-num">1.</span>
              <input type="text" id="entry1" placeholder="例如：早上吃到熱騰騰好吃的地瓜粥">
            </div>
            <div class="input-row">
              <span class="row-num">2.</span>
              <input type="text" id="entry2" placeholder="例如：老朋友打電話來互相關心問候">
            </div>
            <div class="input-row">
              <span class="row-num">3.</span>
              <input type="text" id="entry3" placeholder="例如：陽台的花開得很漂亮（可選填）">
            </div>
          </div>

          <div class="btn-row">
            <button class="action-btn secondary-btn" onclick="goToStep(1)">⬅️ 上一步</button>
            <button class="action-btn" id="submitBtn" onclick="submitJournal()">儲存日記 ✨</button>
          </div>
        </div>
      </section>
    </main>

    <section id="reviewView" style="display: none;">
      <div class="calendar-card">
        <div class="cal-header">
          <button class="cal-nav-btn" onclick="changeMonth(-1)">⬅️ 上個月</button>
          <span class="cal-title" id="calendarTitle">載入中...</span>
          <button class="cal-nav-btn" onclick="changeMonth(1)">下個月 ➡️</button>
        </div>
        <div class="cal-weekdays">
          <span>週日</span><span>週一</span><span>週二</span><span>週三</span><span>週四</span><span>週五</span><span>週六</span>
        </div>
        <div class="cal-grid" id="calendarGrid"></div>
      </div>
      <div id="reviewStatus" style="text-align: center; color: var(--text-sub); font-size: 13px;"></div>
    </section>
  </div>

  <!-- 詳細日記檢視彈窗（僅移除最底部的刪除按鈕） -->
  <div class="modal-backdrop" id="journalModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close-btn" onclick="closeModal()">✕</button>
      <div id="modalDate" style="font-size: 18px; font-weight: 700; color: var(--primary-color); margin-bottom: 8px;"></div>
      <div id="modalMeta" style="font-size: 14px; color: var(--text-sub); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px dashed var(--border-color);"></div>
      <div id="modalItems" style="font-size: 16px; margin-bottom: 14px; line-height: 1.8;"></div>
      <div id="modalPhotoWrap"></div>
    </div>
  </div>

  <script>
    // ✅ 保留你原有的後端網址與 LIFF ID
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzhehtgLV2Qr8VvEtc_QdZqwGLww5NVUJ9DIuBQxgmJ8sOmshOHFz_NTFkGC9_lvHvbjg/exec";
    const LIFF_ID = "2011514403-R97dhtDl";

    let userId = "guest_user";
    let ENCRYPTION_KEY = userId;

    const urlParams = new URLSearchParams(window.location.search);
    const initialTab = urlParams.get('tab') || "write";

    let selectedWeather = "☀️ 晴天";
    let selectedMood = "😊 開心";
    let base64Photo = "";

    let allJournals = [];
    let currentCalDate = new Date();
    let currentActiveJournal = null;

    async function initializeLiff() {
      const urlUid = urlParams.get('uid');
      if (urlUid) {
        userId = urlUid;
        ENCRYPTION_KEY = userId;
      } else if (LIFF_ID && LIFF_ID !== "YOUR_LIFF_ID_HERE") {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            userId = profile.userId;
            ENCRYPTION_KEY = userId;
          } else {
            liff.login();
            return;
          }
        } catch (err) {
          console.warn("LIFF 初始化跳過或失敗，切換為訪客模式:", err);
        }
      }

      initDate();
      if (initialTab === 'review') {
        switchView('review');
      } else {
        switchView('write');
      }
    }

    function initDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const weekDays = ["日", "一", "二", "三", "四", "五", "六"];
      const dayName = weekDays[now.getDay()];
      document.getElementById('displayDate').innerText = `📅 ${year} 年 ${month} 月 ${date} 日 (星期${dayName})`;
    }

    function switchView(tab) {
      const writeView = document.getElementById('writeView');
      const reviewView = document.getElementById('reviewView');
      const tabWrite = document.getElementById('tabWrite');
      const tabReview = document.getElementById('tabReview');

      if (tab === 'review') {
        writeView.style.display = 'none';
        reviewView.style.display = 'block';
        tabWrite.classList.remove('active');
        tabReview.classList.add('active');
        loadJournals();
      } else {
        reviewView.style.display = 'none';
        writeView.style.display = 'block';
        tabReview.classList.remove('active');
        tabWrite.classList.add('active');
      }
    }

    function goToStep(step) {
      const p1 = document.getElementById('page1');
      const p2 = document.getElementById('page2');
      const indicator = document.getElementById('stepIndicator');

      if (step === 2) {
        p1.style.display = 'none';
        p2.style.display = 'block';
        indicator.innerText = '第 2 / 2 步';
      } else {
        p2.style.display = 'none';
        p1.style.display = 'block';
        indicator.innerText = '第 1 / 2 步';
      }
    }

    function selectWeather(val) {
      selectedWeather = val;
      const pills = document.getElementById('weatherGroup').getElementsByClassName('select-pill');
      for (let p of pills) p.classList.toggle('active', p.innerText === val);
    }

    function selectPresetMood(val) {
      selectedMood = val;
      document.getElementById('customMood').value = '';
      const pills = document.getElementById('moodGroup').getElementsByClassName('select-pill');
      for (let p of pills) p.classList.toggle('active', p.innerText === val);
    }

    function handleCustomMoodInput() {
      const customVal = document.getElementById('customMood').value.trim();
      const pills = document.getElementById('moodGroup').getElementsByClassName('select-pill');
      if (customVal) {
        for (let p of pills) p.classList.remove('active');
        selectedMood = `✨ ${customVal}`;
      } else {
        pills[0].classList.add('active');
        selectedMood = pills[0].innerText;
      }
    }

    function handlePhotoSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 800;
          let width = img.width;
          let height = img.height;

          if (width > height && width > maxDim) {
            height = (height * maxDim) / width;
            width = maxDim;
          } else if (height > maxDim) {
            width = (width * maxDim) / height;
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          base64Photo = canvas.toDataURL('image/jpeg', 0.7);
          document.getElementById('photoPreview').src = base64Photo;
          document.getElementById('previewContainer').style.display = 'inline-block';
          document.getElementById('uploadHintText').style.display = 'none';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function removePhoto(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      base64Photo = "";
      document.getElementById('photoInput').value = "";
      document.getElementById('photoPreview').src = "";
      document.getElementById('previewContainer').style.display = 'none';
      document.getElementById('uploadHintText').style.display = 'inline';
    }

    async function submitJournal() {
      const e1 = document.getElementById('entry1').value.trim();
      const e2 = document.getElementById('entry2').value.trim();
      const e3 = document.getElementById('entry3').value.trim();
      const btn = document.getElementById('submitBtn');

      if (!e1 && !e2 && !e3) {
        alert("請至少在第 1 點寫下一件感恩的小事喔！🌸");
        return;
      }

      const payloadData = {
        weather: selectedWeather,
        mood: selectedMood,
        items: [e1, e2, e3].filter(Boolean),
        photo: base64Photo
      };

      const rawJson = JSON.stringify(payloadData);
      const encryptedContent = CryptoJS.AES.encrypt(rawJson, ENCRYPTION_KEY).toString();

      btn.disabled = true;
      btn.innerText = "保密儲存中...✨";

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            uid: userId,
            content: encryptedContent
          })
        });

        alert("今天的感恩手帳已為您加密珍藏囉！🌸✨");
        document.getElementById('entry1').value = "";
        document.getElementById('entry2').value = "";
        document.getElementById('entry3').value = "";
        removePhoto();
        goToStep(1);
        switchView('review');
      } catch (err) {
        console.error(err);
        alert("已為您儲存！");
        goToStep(1);
        switchView('review');
      } finally {
        btn.disabled = false;
        btn.innerText = "儲存日記 ✨";
      }
    }

    async function loadJournals() {
      const status = document.getElementById('reviewStatus');
      status.innerText = "正在翻開手帳本...✨";

      try {
        const res = await fetch(`${SCRIPT_URL}?uid=${encodeURIComponent(userId)}&_t=${Date.now()}`);
        const data = await res.json();
        
        allJournals = (data || []).map(item => {
          let parsedData = null;
          try {
            const bytes = CryptoJS.AES.decrypt(item.content, ENCRYPTION_KEY);
            const decrypted = bytes.toString(CryptoJS.enc.Utf8);
            try {
              parsedData = JSON.parse(decrypted);
            } catch {
              parsedData = { rawText: decrypted };
            }
          } catch (e) {
            parsedData = { rawText: item.content };
          }
          return {
            dateStr: item.date,
            data: parsedData
          };
        });

        status.innerText = `已載入 ${allJournals.length} 篇回憶日記`;
        renderCalendar();
      } catch (err) {
        console.error(err);
        status.innerText = "載入日記時發生問題，請稍後重試。";
      }
    }

    function changeMonth(delta) {
      currentCalDate.setMonth(currentCalDate.getMonth() + delta);
      renderCalendar();
    }

    function parseDateSafe(dateStr) {
      if (!dateStr) return null;
      let d = new Date(dateStr);
      if (!isNaN(d.getTime())) return d;
      
      const matches = dateStr.match(/(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})/);
      if (matches) {
        return new Date(parseInt(matches[1]), parseInt(matches[2]) - 1, parseInt(matches[3]));
      }
      return null;
    }

    function renderCalendar() {
      const year = currentCalDate.getFullYear();
      const month = currentCalDate.getMonth();
      document.getElementById('calendarTitle').innerText = `${year} 年 ${month + 1} 月`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = "";

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      const journalMap = {};
      allJournals.forEach(j => {
        const d = parseDateSafe(j.dateStr);
        if (d && d.getFullYear() === year && d.getMonth() === month) {
          journalMap[d.getDate()] = j;
        }
      });

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'cal-day-cell';
        grid.appendChild(emptyCell);
      }

      for (let day = 1; day <= totalDays; day++) {
        const cell = document.createElement('div');
        cell.className = 'cal-day-cell';

        const journal = journalMap[day];

        if (journal) {
          const bubble = document.createElement('div');
          bubble.className = 'cal-bubble';

          const photoUrl = journal.data?.photo;
          if (photoUrl) {
            bubble.style.backgroundImage = `url(${photoUrl})`;
          } else {
            bubble.style.background = 'linear-gradient(135deg, #FFEAD2, #E28743)';
          }

          bubble.innerHTML = `
            <div class="cal-bubble-overlay"></div>
            <span class="cal-bubble-day">${day}</span>
          `;
          bubble.onclick = () => openModal(journal, day);
          cell.appendChild(bubble);
        } else {
          cell.innerHTML = `<span class="cal-day-num">${day}</span>`;
        }

        grid.appendChild(cell);
      }
    }

    function openModal(journal, day) {
      currentActiveJournal = journal;
      const modal = document.getElementById('journalModal');
      const year = currentCalDate.getFullYear();
      const month = currentCalDate.getMonth() + 1;

      document.getElementById('modalDate').innerText = `📅 ${year} 年 ${month} 月 ${day} 日`;

      const data = journal.data;
      if (data.rawText) {
        document.getElementById('modalMeta').innerText = "";
        document.getElementById('modalItems').innerHTML = data.rawText.split('\n').map(l => `<div>${l}</div>`).join('');
        document.getElementById('modalPhotoWrap').innerHTML = "";
      } else {
        document.getElementById('modalMeta').innerText = `天氣：${data.weather || '☀️ 晴天'} ｜ 心情：${data.mood || '😊 開心'}`;
        
        let itemsHtml = "";
        if (data.items && data.items.length > 0) {
          itemsHtml = data.items.map((item, idx) => `<div><b>${idx + 1}.</b> ${item}</div>`).join('');
        }
        document.getElementById('modalItems').innerHTML = itemsHtml;

        if (data.photo) {
          document.getElementById('modalPhotoWrap').innerHTML = `<img src="${data.photo}" class="modal-photo" alt="手帳照片">`;
        } else {
          document.getElementById('modalPhotoWrap').innerHTML = "";
        }
      }

      modal.classList.add('active');
    }

    function closeModal(event) {
      document.getElementById('journalModal').classList.remove('active');
    }

    window.addEventListener('DOMContentLoaded', () => {
      initializeLiff();
    });
  </script>
</body>
</html>
